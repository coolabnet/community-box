services:
  filebrowser:
    # FileBrowser Quantum, the maintained fork of FileBrowser.
    # The original filebrowser/filebrowser image was archived on 2026-09-01.
    # Pin a release such as 2.0.2-stable for reproducible installs.
    image: gtstef/filebrowser:${FB_TAG:-stable}
    container_name: filebrowser
    user: "1000:1000"
    ports:
      - "8080:80"
    volumes:
      - ./data:/folder # The files people browse, upload and share
      - ./filebrowser:/home/filebrowser/data # config.yaml, database, cache
    environment:
      # Leave empty to get a one-time random password in the logs.
      - FILEBROWSER_ADMIN_PASSWORD=${FB_ADMIN_PASSWORD:-}
    restart: unless-stopped
    networks:
      - files_network

  # Optional: Syncthing for file synchronization
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: syncthing
    ports:
      - "8384:8384" # Web UI
      - "22000:22000/tcp" # TCP file transfer
      - "22000:22000/udp" # QUIC file transfer
      - "21027:21027/udp" # Discovery broadcast
    volumes:
      - syncthing_config:/var/syncthing/config
      - ./data:/var/syncthing/data # Same directory as FileBrowser
    restart: unless-stopped
    networks:
      - files_network

volumes:
  syncthing_config:

networks:
  files_network:
    driver: bridge
